<html>

<head>
    <title>Lozina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header class="navbar">
        <div class="container nav-inner">
            <div class="nav-logo">
                <a href="index.html">
                    <img src="images/logo.jpg" alt="">
                </a>
            </div>
    
            <nav class="nav-links">
                <a href="products.html" class="btn">Products</a>
                <a href="categories.html" class="btn">Categories</a>
            </nav>
        </div>
    </header>


    <main class="container section auth">
        <form class="auth-box" action="#" method="post">
            <h1>Welcome back</h1>
            <p class="auth-sub">Login to your account</p>
        
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
        
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required>
        
            <button type="submit" class="btn btn-full">Login</button>
        
            <p class="auth-switch">No account yet? <a href="signup.html">Sign up</a></p>
        </form>
    </main>

    <footer class="footer">
        <div class="container footer-grid">
            <div>
                <h3>Lozina Toaster</h3>
                <p>Finest coffee, nuts and snacks. Come taste the difference.</p>
            </div>
    
            <div>
                <h4>Pages</h4>
                <a href="index.html">Home</a>
                <a href="categories.html">Categories</a>
                <a href="products.html">Products</a>
            </div>
    
            <div>
                <h4>Account</h4>
                <a href="login.html">Login</a>
                <a href="signup.html">Sign up</a>
            </div>
        </div>
    
        <p class="copyright">&copy; 2026 Lozina Toaster. All rights reserved.</p>
    </footer>

</body>

</html>
